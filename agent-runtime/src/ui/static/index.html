<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #0a0c0e;
    --panel: #111417;
    --panel-alt: #14181c;
    --border: #2a2f36;
    --border-bright: #454c56;
    --text: #d7dbe0;
    --text-dim: #6b7480;
    --amber: #f5a623;
    --amber-dim: #8a6318;
    --green: #3ecf6e;
    --red: #e5484d;
    --grey: #545c66;
    --font-mono: ui-monospace, "Cascadia Mono", "SFMono-Regular", "Consolas", "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
  }
  #app {
    display: grid;
    grid-template-columns: 220px 1fr;
    grid-template-rows: 48px 1fr;
    grid-template-areas:
      "header header"
      "sidebar main";
    height: 100vh;
  }

  header {
    grid-area: header;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--amber);
    text-transform: uppercase;
  }
  header .brand .tick {
    width: 8px;
    height: 8px;
    background: var(--amber);
  }
  header .active-label {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }
  header .active-label span { color: var(--text); }

  #sidebar {
    grid-area: sidebar;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 12px 0;
    overflow-y: auto;
  }
  .sidebar-title {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1.5px;
    padding: 0 16px 8px;
    text-transform: uppercase;
  }
  .agent-btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: transparent;
    border: none;
    border-left: 3px solid transparent;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    cursor: pointer;
    text-align: left;
  }
  .agent-btn:hover { background: rgba(255, 255, 255, 0.03); color: var(--text); }
  .agent-btn.active {
    border-left-color: var(--amber);
    background: rgba(245, 166, 35, 0.07);
    color: var(--text);
  }
  .agent-btn .name { flex: 1; }
  .led {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--grey);
    flex-shrink: 0;
    box-shadow: 0 0 0 rgba(0,0,0,0);
  }
  .led.idle { background: var(--grey); }
  .led.initializing { background: var(--amber); animation: pulse 1s infinite; }
  .led.ready { background: var(--green); box-shadow: 0 0 5px rgba(62, 207, 110, 0.6); }
  .led.error { background: var(--red); box-shadow: 0 0 5px rgba(229, 72, 77, 0.6); }
  @keyframes pulse { 50% { opacity: 0.25; } }
  .agent-status-text {
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  #main {
    grid-area: main;
    display: grid;
    grid-template-rows: 1fr auto;
    min-width: 0;
  }

  #log {
    overflow-y: auto;
    padding: 14px 20px;
  }
  .entry {
    display: grid;
    grid-template-columns: 68px 90px 1fr;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    align-items: start;
  }
  .entry .ts { color: var(--text-dim); font-size: 11px; padding-top: 1px; }
  .entry .role { font-size: 11px; font-weight: 700; letter-spacing: 0.6px; padding-top: 1px; }
  .entry.user .role { color: var(--text-dim); }
  .entry.assistant .role { color: var(--amber); }
  .entry.error .role { color: var(--red); }
  .entry .content {
    white-space: pre-wrap;
    word-wrap: break-word;
    line-height: 1.5;
  }
  .entry.error .content { color: #ff9a9a; }
  .entry.assistant.pending .content::after {
    content: "";
    display: inline-block;
    width: 6px;
    height: 11px;
    margin-left: 2px;
    background: var(--amber);
    animation: pulse 0.9s infinite;
    vertical-align: text-bottom;
  }
  .entry code {
    background: rgba(255, 255, 255, 0.06);
    padding: 1px 5px;
    font-size: 0.95em;
  }
  .entry pre {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    padding: 10px 12px;
    overflow-x: auto;
    margin: 6px 0;
  }
  .entry pre code { background: none; padding: 0; }
  .empty-state {
    color: var(--text-dim);
    font-size: 12px;
    padding: 20px 0;
    letter-spacing: 0.4px;
  }

  .deploy-card {
    margin-top: 8px;
    border: 1px solid var(--amber-dim);
    background: rgba(245, 166, 35, 0.05);
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .deploy-card.deployed {
    border-color: var(--green);
    background: rgba(62, 207, 110, 0.05);
  }
  .deploy-card .info {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.3px;
  }
  .deploy-card .info strong { color: var(--amber); }
  .deploy-card.deployed .info strong { color: var(--green); }
  .deploy-btn {
    background: transparent;
    border: 1px solid var(--amber);
    color: var(--amber);
    padding: 6px 14px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    flex-shrink: 0;
    font-family: var(--font-mono);
  }
  .deploy-btn:hover { background: rgba(245, 166, 35, 0.12); }
  .deploy-btn:disabled {
    border-color: var(--green);
    color: var(--green);
    cursor: default;
    opacity: 0.8;
  }

  #composer {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 12px 20px 16px;
  }
  #composer .row {
    display: flex;
    gap: 10px;
  }
  #input {
    flex: 1;
    resize: none;
    background: var(--bg);
    border: 1px solid var(--border-bright);
    color: var(--text);
    padding: 9px 12px;
    font-size: 13px;
    font-family: var(--font-mono);
    max-height: 160px;
    line-height: 1.4;
  }
  #input:focus { outline: none; border-color: var(--amber); }
  #input:disabled { opacity: 0.45; cursor: not-allowed; }
  #send {
    background: var(--amber);
    color: #1a1300;
    border: none;
    padding: 0 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    flex-shrink: 0;
  }
  #send:hover:not(:disabled) { background: #ffb84d; }
  #send:disabled { background: var(--grey); color: var(--text-dim); cursor: not-allowed; }
  #hint {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.6px;
    padding-top: 8px;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.hidden { display: none; }
  .modal-box {
    width: 540px;
    max-width: 92vw;
    max-height: 85vh;
    background: var(--panel);
    border: 1px solid var(--border-bright);
    display: flex;
    flex-direction: column;
  }
  .modal-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .modal-header h2 {
    margin: 0;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--amber);
  }
  .modal-close {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
  }
  .modal-close:hover { color: var(--text); }
  .modal-body {
    padding: 16px 18px;
    overflow-y: auto;
    font-size: 12px;
  }
  .modal-field { margin-bottom: 14px; }
  .modal-field label {
    display: block;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .modal-field .value { word-break: break-all; }
  .modal-field input[type="number"] {
    background: var(--bg);
    border: 1px solid var(--border-bright);
    color: var(--text);
    padding: 7px 10px;
    font-family: var(--font-mono);
    font-size: 13px;
    width: 140px;
  }
  .modal-field input:focus { outline: none; border-color: var(--amber); }
  .modal-field input:disabled { opacity: 0.5; }
  .tool-list { list-style: none; margin: 0; padding: 0; }
  .tool-list li {
    padding: 4px 0;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
  }
  .tool-list li:last-child { border-bottom: none; }
  .tool-list .tname { color: var(--amber); }
  .deploy-log {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 10px 12px;
    font-size: 11px;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 220px;
    overflow-y: auto;
  }
  .modal-footer {
    padding: 12px 18px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    flex-shrink: 0;
  }
  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border-bright);
    color: var(--text-dim);
    padding: 8px 16px;
    font-size: 11px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: var(--font-mono);
  }
  .btn-secondary:hover { color: var(--text); border-color: var(--text-dim); }
  .btn-primary {
    background: var(--amber);
    color: #1a1300;
    border: none;
    padding: 8px 18px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: var(--font-mono);
  }
  .btn-primary:hover:not(:disabled) { background: #ffb84d; }
  .btn-primary:disabled { background: var(--grey); color: var(--text-dim); cursor: not-allowed; }
  .status-line { font-size: 11px; margin-top: 10px; min-height: 14px; }
  .status-line.ok { color: var(--green); }
  .status-line.fail { color: var(--red); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="tick"></span>{{TITLE}}</div>
    <div class="active-label">CHANNEL: <span id="active-label-name">—</span></div>
  </header>

  <nav id="sidebar">
    <div class="sidebar-title">Agents</div>
    <div id="agent-list"></div>
  </nav>

  <div id="main">
    <div id="log"><div class="empty-state">Select an agent to begin.</div></div>
    <div id="composer">
      <div class="row">
        <textarea id="input" rows="1" placeholder="Message…" disabled></textarea>
        <button id="send" type="button" disabled>Send</button>
      </div>
      <div id="hint">ENTER TO SEND · SHIFT+ENTER FOR NEW LINE</div>
    </div>
  </div>
</div>

<div id="deploy-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="deploy-modal-title">Deploy</h2>
      <button class="modal-close" id="deploy-modal-close" type="button">&times;</button>
    </div>
    <div class="modal-body">
      <div class="modal-field">
        <label>File</label>
        <div class="value" id="deploy-file-path"></div>
      </div>
      <div class="modal-field">
        <label>Declared tools</label>
        <ul class="tool-list" id="deploy-tool-list"></ul>
      </div>
      <div class="modal-field" id="deploy-uncertainties-field" style="display:none">
        <label>Uncertainties</label>
        <ul class="tool-list" id="deploy-uncertainties"></ul>
      </div>
      <div class="modal-field">
        <label>Port</label>
        <input type="number" id="deploy-port" min="1024" max="65535" />
      </div>
      <div id="deploy-log" class="deploy-log" style="display:none"></div>
      <div id="deploy-status" class="status-line"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" id="deploy-cancel" type="button">Cancel</button>
      <button class="btn-primary" id="deploy-confirm" type="button">Confirm Deploy</button>
    </div>
  </div>
</div>

<script>
(function () {
  const AGENTS = [
    { key: "system", name: "System Agent" },
    { key: "researcher", name: "Researcher" },
    { key: "generator", name: "Generator" },
  ];

  const state = {
    active: AGENTS[0].key,
    status: {},   // key -> "idle" | "initializing" | "ready" | "error"
    history: {},  // key -> [{role, text, deploy?}]
    busy: false,
  };
  AGENTS.forEach(a => { state.status[a.key] = "idle"; state.history[a.key] = []; });

  const agentListEl = document.getElementById("agent-list");
  const logEl = document.getElementById("log");
  const inputEl = document.getElementById("input");
  const sendEl = document.getElementById("send");
  const activeLabelEl = document.getElementById("active-label-name");

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function renderContent(raw) {
    let html = escapeHtml(raw);
    html = html.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code}</code></pre>`);
    html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    return html;
  }

  function ts() {
    const d = new Date();
    const p = n => String(n).padStart(2, "0");
    return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }

  function roleLabel(role, agentKey) {
    if (role === "user") return "OPERATOR";
    if (role === "error") return "FAULT";
    return AGENTS.find(a => a.key === agentKey).name.toUpperCase();
  }

  // --- NDJSON stream reading -------------------------------------------

  async function readNdjson(response, onEvent) {
    if (!response.ok || !response.body) throw new Error(`request failed (${response.status})`);
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, nl);
        buffer = buffer.slice(nl + 1);
        if (line.trim()) onEvent(JSON.parse(line));
      }
    }
    if (buffer.trim()) onEvent(JSON.parse(buffer));
  }

  // --- Sidebar / agent lifecycle -----------------------------------------

  function buildSidebar() {
    agentListEl.innerHTML = "";
    AGENTS.forEach(a => {
      const btn = document.createElement("button");
      btn.className = "agent-btn" + (a.key === state.active ? " active" : "");
      btn.dataset.key = a.key;
      btn.innerHTML = `
        <span class="led ${state.status[a.key]}"></span>
        <span class="name">${a.name}</span>
        <span class="agent-status-text">${state.status[a.key]}</span>
      `;
      btn.addEventListener("click", () => selectAgent(a.key));
      agentListEl.appendChild(btn);
    });
  }

  function refreshSidebarStatus() {
    AGENTS.forEach(a => {
      const btn = agentListEl.querySelector(`[data-key="${a.key}"]`);
      if (!btn) return;
      btn.classList.toggle("active", a.key === state.active);
      const led = btn.querySelector(".led");
      led.className = "led " + state.status[a.key];
      btn.querySelector(".agent-status-text").textContent = state.status[a.key];
    });
  }

  function renderLog() {
    const entries = state.history[state.active];
    if (entries.length === 0) {
      logEl.innerHTML = '<div class="empty-state">No transmissions yet.</div>';
      return;
    }
    logEl.innerHTML = "";
    entries.forEach(e => {
      const row = document.createElement("div");
      row.className = "entry " + e.role + (e.pending ? " pending" : "");
      row.innerHTML = `
        <div class="ts">${e.ts}</div>
        <div class="role">${roleLabel(e.role, state.active)}</div>
        <div class="content"></div>
      `;
      const contentEl = row.querySelector(".content");
      contentEl.innerHTML = renderContent(e.text || "");

      if (e.deploy) {
        const deployed = e.deploy.status === "deployed";
        const card = document.createElement("div");
        card.className = "deploy-card" + (deployed ? " deployed" : "");
        const toolCount = (e.deploy.tools || []).length;
        card.innerHTML = `
          <div class="info"><strong>${escapeHtml(e.deploy.technology || "unknown")}</strong> generated — ${toolCount} tool${toolCount === 1 ? "" : "s"}</div>
          <button class="deploy-btn" type="button" ${deployed ? "disabled" : ""}>${deployed ? "Deployed" : "Deploy"}</button>
        `;
        if (!deployed) {
          card.querySelector(".deploy-btn").addEventListener("click", () => openDeployModal(e));
        }
        contentEl.appendChild(card);
      }

      logEl.appendChild(row);
    });
    logEl.scrollTop = logEl.scrollHeight;
  }

  function updateComposer() {
    const ready = state.status[state.active] === "ready";
    inputEl.disabled = state.busy || !ready;
    sendEl.disabled = state.busy || !ready;
    inputEl.placeholder = ready ? "Message…" : `Agent ${state.status[state.active]}…`;
  }

  function selectAgent(key) {
    state.active = key;
    activeLabelEl.textContent = AGENTS.find(a => a.key === key).name.toUpperCase();
    refreshSidebarStatus();
    renderLog();
    updateComposer();
    ensureInitialized(key);
    if (!state.busy) inputEl.focus();
  }

  async function ensureInitialized(key) {
    if (state.status[key] === "ready" || state.status[key] === "initializing") return;
    state.status[key] = "initializing";
    refreshSidebarStatus();
    updateComposer();
    try {
      await fetch(`/api/agents/${key}/init`, { method: "POST" });
    } catch (e) {
      state.status[key] = "error";
      refreshSidebarStatus();
      updateComposer();
      return;
    }
    pollStatus(key);
  }

  async function pollStatus(key) {
    try {
      const res = await fetch(`/api/agents/${key}/status`);
      const data = await res.json();
      state.status[key] = data.status;
      refreshSidebarStatus();
      if (key === state.active) updateComposer();
      if (data.status === "initializing") {
        setTimeout(() => pollStatus(key), 1200);
      }
    } catch (e) {
      state.status[key] = "error";
      refreshSidebarStatus();
      if (key === state.active) updateComposer();
    }
  }

  // --- Chat -----------------------------------------------------------

  function handleChatEvent(entry, event) {
    if (event.type === "token") {
      entry.text += event.text;
    } else if (event.type === "deploy_candidate") {
      entry.deploy = { ...event, status: "pending" };
    } else if (event.type === "error") {
      entry.errored = true;
      entry.text += (entry.text ? "\n\n" : "") + "ERROR: " + (event.message || "stream failed");
    }
  }

  async function sendMessage(text) {
    const key = state.active;
    state.history[key].push({ role: "user", text, ts: ts() });
    state.busy = true;
    updateComposer();
    renderLog();

    const entry = { role: "assistant", text: "", ts: ts(), pending: true, deploy: null };
    state.history[key].push(entry);
    renderLog();

    try {
      const res = await fetch(`/api/agents/${key}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      await readNdjson(res, (event) => {
        handleChatEvent(entry, event);
        if (key === state.active) renderLog();
      });
      if (!entry.text && !entry.deploy) {
        state.history[key] = state.history[key].filter(e => e !== entry);
      }
    } catch (err) {
      state.history[key] = state.history[key].filter(e => e !== entry);
      state.history[key].push({ role: "error", text: err.message, ts: ts() });
    } finally {
      entry.pending = false;
      state.busy = false;
      updateComposer();
      if (key === state.active) {
        renderLog();
        inputEl.focus();
      }
    }
  }

  function trySend() {
    const text = inputEl.value.trim();
    if (!text || state.busy || state.status[state.active] !== "ready") return;
    inputEl.value = "";
    inputEl.style.height = "auto";
    sendMessage(text);
  }

  sendEl.addEventListener("click", trySend);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      trySend();
    }
  });
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
  });

  // --- Deploy modal -----------------------------------------------------

  const modalEl = document.getElementById("deploy-modal");
  const modalTitleEl = document.getElementById("deploy-modal-title");
  const modalFileEl = document.getElementById("deploy-file-path");
  const modalToolsEl = document.getElementById("deploy-tool-list");
  const modalUncertaintiesField = document.getElementById("deploy-uncertainties-field");
  const modalUncertaintiesEl = document.getElementById("deploy-uncertainties");
  const modalPortEl = document.getElementById("deploy-port");
  const modalLogEl = document.getElementById("deploy-log");
  const modalStatusEl = document.getElementById("deploy-status");
  const modalConfirmEl = document.getElementById("deploy-confirm");
  const modalCancelEl = document.getElementById("deploy-cancel");
  const modalCloseEl = document.getElementById("deploy-modal-close");

  let activeDeployEntry = null;

  async function openDeployModal(entry) {
    activeDeployEntry = entry;
    const c = entry.deploy;

    modalTitleEl.textContent = `Deploy — ${c.technology || "unknown"}`;
    modalFileEl.textContent = c.file_path || "";
    modalToolsEl.innerHTML = (c.tools || []).map(t =>
      `<li><span class="tname">${escapeHtml(t.name || "?")}</span>(${escapeHtml(t.signature || "")})</li>`
    ).join("") || "<li>No declared tools found.</li>";

    if (c.uncertainties && c.uncertainties.length) {
      modalUncertaintiesField.style.display = "";
      modalUncertaintiesEl.innerHTML = c.uncertainties.map(u => `<li>${escapeHtml(u)}</li>`).join("");
    } else {
      modalUncertaintiesField.style.display = "none";
    }

    modalPortEl.value = "";
    modalPortEl.disabled = false;
    modalLogEl.style.display = "none";
    modalLogEl.textContent = "";
    modalStatusEl.textContent = "";
    modalStatusEl.className = "status-line";
    modalConfirmEl.disabled = false;
    modalConfirmEl.textContent = "Confirm Deploy";
    modalCancelEl.textContent = "Cancel";
    modalEl.classList.remove("hidden");

    try {
      const res = await fetch("/api/deploy/suggest-port");
      const data = await res.json();
      modalPortEl.value = data.port;
    } catch (e) {
      modalPortEl.value = 9100;
    }
  }

  function closeDeployModal() {
    modalEl.classList.add("hidden");
    activeDeployEntry = null;
  }

  modalCancelEl.addEventListener("click", closeDeployModal);
  modalCloseEl.addEventListener("click", closeDeployModal);
  modalEl.addEventListener("click", (e) => { if (e.target === modalEl) closeDeployModal(); });

  modalConfirmEl.addEventListener("click", async () => {
    if (!activeDeployEntry) return;
    const c = activeDeployEntry.deploy;
    const port = parseInt(modalPortEl.value, 10);
    if (!port || port < 1024 || port > 65535) {
      modalStatusEl.textContent = "Enter a valid port (1024-65535).";
      modalStatusEl.className = "status-line fail";
      return;
    }

    modalConfirmEl.disabled = true;
    modalConfirmEl.textContent = "Deploying…";
    modalPortEl.disabled = true;
    modalLogEl.style.display = "";
    modalLogEl.textContent = "";
    modalStatusEl.textContent = "";
    modalStatusEl.className = "status-line";

    let success = false;
    let failMessage = "";

    try {
      const res = await fetch("/api/deploy", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ file_path: c.file_path, port }),
      });
      await readNdjson(res, (event) => {
        if (event.type === "log") {
          modalLogEl.textContent += event.line + "\n";
          modalLogEl.scrollTop = modalLogEl.scrollHeight;
        } else if (event.type === "done") {
          success = !!event.success;
        } else if (event.type === "error") {
          failMessage = event.message || "deploy failed";
        }
      });

      if (!success) throw new Error(failMessage || "deploy failed");

      modalStatusEl.textContent = "Deployed successfully.";
      modalStatusEl.className = "status-line ok";
      modalConfirmEl.textContent = "Deployed";
      modalCancelEl.textContent = "Close";
      c.status = "deployed";
      renderLog();
    } catch (err) {
      modalStatusEl.textContent = "Failed: " + err.message;
      modalStatusEl.className = "status-line fail";
      modalConfirmEl.disabled = false;
      modalConfirmEl.textContent = "Retry Deploy";
      modalPortEl.disabled = false;
    }
  });

  buildSidebar();
  selectAgent(state.active);
})();
</script>
</body>
</html>
