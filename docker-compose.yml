  aasx-server:
    image: eclipsebasyx/aas-environment:2.0.0-SNAPSHOT
    container_name: aasx-server
    environment:
      - SERVER_PORT=5001
      - JAVA_TOOL_OPTIONS=-Dpoi.byteArrayMaxOverride=450000000
    env_file:
      - .env 
    volumes:
      - ./aasxs:/application/aas
      - ./basyx/aas-env.properties:/application/application.properties
    ports:
      - '5051:5001'
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    depends_on:
      aas-registry:
        condition: service_healthy
      aas-sm-registry:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - agentic-net

  aas-registry:
    image: eclipsebasyx/aas-registry-log-mongodb:2.0.0-SNAPSHOT
    container_name: aas-registry
    ports:
      - '5010:5010'
    environment:
      - SERVER_PORT=5010
    env_file:
    - .env
    volumes:
      - ./basyx/aas-registry.yml:/workspace/config/application.yml
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5010/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s 
    networks:
      - agentic-net

  aas-sm-registry:
    image: eclipsebasyx/submodel-registry-log-mongodb:2.0.0-SNAPSHOT
    container_name: aas-sm-registry
    ports:
      - '5020:5020'
    env_file:
    - .env
    environment:
      - SERVER_PORT=5020
    volumes:
      - ./basyx/sm-registry.yml:/workspace/config/application.yml
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5020/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - agentic-net

  aas-discovery:
    image: eclipsebasyx/aas-discovery:2.0.0-SNAPSHOT
    container_name: aas-discovery
    env_file:
      - .env
    environment:
      - SERVER_PORT=5030
    volumes:
      - ./basyx/aas-discovery.properties:/application/application.properties
    ports:
      - '5030:5030'
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - agentic-net
  
  aas-web-ui:
    image: eclipsebasyx/aas-gui:SNAPSHOT
    container_name: aas-web-ui
    ports:
      - '5040:3000'
    environment:
      AAS_REGISTRY_PATH: http://localhost:5010/shell-descriptors      # ← was 5020
      SUBMODEL_REGISTRY_PATH: http://localhost:5020/submodel-descriptors  # ← was 5021
      AAS_REPO_PATH: http://localhost:5051/shells                     # ← was 5020
      SUBMODEL_REPO_PATH: http://localhost:5051/submodels             # ← was 5020
      CD_REPO_PATH: http://localhost:5051/concept-descriptions        # ← was 5020
      AAS_DISCOVERY_PATH: http://localhost:5030/lookup/shells         # ← correct
      DASHBOARD_SERVICE_PATH: http://localhost:5060/api/elements      # ← was 5035
      PRIMARY_COLOR: '#144AF6'
    restart: always
    depends_on:
      aasx-server:
        condition: service_healthy
    networks:
      - agentic-net

  dashboard-api:
    image: aaronzi/basyx-dashboard-api:SNAPSHOT_02
    container_name: dashboard-api
    env_file:
      - .env
    ports:
      - '5060:5060'
    volumes:
      - ./basyx/aas-dashboard.yml:/application.yml
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - agentic-net

  agent-runtime:
    container_name: agent-runtime
    build: ./agent-runtime
    restart: unless-stopped
    depends_on:
      - aasx-server
    ports:
      - "8000:8000"
    networks:
      - agentic-net
    env_file:
      - .env
    volumes:
      - ./aasxs:/app/aasxs   
  aasx-mcp-service:
    profiles: ["http"]
    build: ./agent-runtime
    container_name: aasx-mcp-service
    command: python -m src.mcp.aasx.aasx_server 
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - MCP_CONNECTION_MODE=http
      - PORT=8080
      - AAS_BASE_URL=http://aasx-server:5001
    depends_on:
      - aasx-server
    volumes:
      - ./aasxs:/app/aasxs
    networks:
      - agentic-net

  kuka-robot:
      container_name: kuka-robot
      build: ./simulators/KukaRobot   
      restart: unless-stopped
      ports:
        - "4849:4849"              # expose OPC UA port
      networks:
        - agentic-net

  opcua-mcp-service:
    profiles: ["http"]
    build: ./agent-runtime
    container_name: opcua-mcp-service
    command: python -m src.mcp.opcua.opcua_server
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      - MCP_CONNECTION_MODE=http
      - PORT=8082
    networks:
      - agentic-net

