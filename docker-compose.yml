  #     - ksqldb-server
  #   networks:
  #     - agentic-net

  mongo-mcp-service:
    profiles: ["http"]
    build: ./agent-runtime
    container_name: mongo-mcp-service
    command: python -m src.mcp.mongodb.mongodb_server
    ports:
      - "8085:8085"
    env_file:
      - .env
    environment:
      - MCP_CONNECTION_MODE=http
      - PORT=8085
      - MONGO_URI=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017
      - KAFKA_CONNECT_URL=http://kafka-connect:8083
    depends_on:
      - mongodb
      # - kafka-connect
    networks:
      - agentic-net

  # node-red:
  #   build: ./agent-runtime/src/mcp/node_red
  #   container_name: node_red
  #   restart: unless-stopped
  #   ports:
  #     - "1880:1880"
  #   networks:
  #     - agentic-net


  docker-mcp-service:
    profiles: ["http"]
    build: ./agent-runtime
    container_name: docker-mcp-service
    command: python -m src.mcp.docker.docker_server
    ports:
      - "8087:8087"
    env_file:
      - .env
    environment:
      - MCP_CONNECTION_MODE=http
      - PORT=8087
      - COMPOSE_PROJECT_NAME=agentic-data-pipelines
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/app/docker-compose.yml
    networks:
      - agentic-net

  opcua-kafka:
    build: ./agent-runtime
    container_name: opcua-kafka
    restart: unless-stopped
    command: python src/mcp/opcua-kafka/opcua_kafka_bridge.py
    depends_on:
      #broker:
        #condition: service_healthy
      kuka-robot:
        condition: service_started
      
    environment:
      - url=opc.tcp://kuka-robot:4849
      - namespace=http://fct.unl.pt/kuka_robot/
      - bootstrap_server=broker:9092
      - topic=opcua.kuka.raw
      - folder=Kuka_Robot
    networks:
      - agentic-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    networks:
      - agentic-net

  grafana-mcp-service:
    profiles: ["http"]
    build: ./agent-runtime
    container_name: grafana-mcp-service
    command: python -m src.mcp.grafana.grafana_server 
    ports:
      - "8089:8089"
    env_file:
      - .env
    environment:
      - MCP_CONNECTION_MODE=http
      - PORT=8089
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_ADMIN_USER=${GRAFANA_USER}
      - GRAFANA_ADMIN_PASSWORD=${GRAFANA_PASSWORD}  
    depends_on:
      - grafana
    networks:
      - agentic-net
      
 

  grafana-bridge-api-service:
    build: ./agent-runtime
    container_name: grafana-bridge
    command: uvicorn src.api.grafana_bridge.grafana_bridge:app --host 0.0.0.0 --port 8090
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017
    depends_on:
      - mongodb
    networks:
      - agentic-net

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8092:8100"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_PORT=8100
      - SEARXNG_BASE_URL=http://localhost:8092/
      - INSTANCE_NAME=agentic-searxng
    networks:
      - agentic-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8100/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  websearch-mcp-service:
    build: ./agent-runtime
    container_name: websearch-mcp-service
    command: python -m src.mcp.websearch.websearch_server
    ports:
      - "8091:8091"
    env_file:
      - .env
    environment:
      - MCP_CONNECTION_MODE=http
      - PORT=8091
      - SEARCH_PROVIDER=searxng
      - SEARXNG_URL=http://searxng:8100
    depends_on:
      searxng:
        condition: service_healthy
    networks:
      - agentic-net
      
  agent-runtime-researcher:
    container_name: agent-runtime-researcher
    build: ./agent-runtime
    restart: unless-stopped
    command: python -m src.ui.researcher_ui
    ports:
      - "7000:7000"
    depends_on:
      - websearch-mcp-service
    env_file: 
      - .env
    networks:
      - agentic-net

  research-mcp-service:
    build: ./agent-runtime
    container_name: research-mcp-service
    command: python -m src.mcp.researcher.researcher_server
    ports:
      - "8093:8093"
    env_file:
      - .env
    environment:
      - MCP_CONNECTION_MODE=http
      - PORT=8093
    depends_on:
      - websearch-mcp-service
    networks:
      - agentic-net

  generator-mcp-service:
    build: ./agent-runtime
    container_name: generator-mcp-service
    command: python -m src.mcp.generator.generator_server
    ports:
      - "8094:8094"
    env_file:
      - .env
    environment:
      - MCP_CONNECTION_MODE=http
      - PORT=8094
    volumes:
      - ./agent-runtime/generated:/app/generated
    networks:
      - agentic-net

  orchestrator-mcp-service:
    build: ./agent-runtime
    container_name: orchestrator-mcp-service
    command: python -m src.mcp.orchestrator.orchestrator_server
    ports:
      - "8095:8095"
    env_file:
      - .env
    environment:
      - MCP_CONNECTION_MODE=http
      - PORT=8095
    depends_on:
      - research-mcp-service
      - generator-mcp-service
    networks:
      - agentic-net

networks:
  agentic-net:
    name: agentic-net
    driver: bridge
