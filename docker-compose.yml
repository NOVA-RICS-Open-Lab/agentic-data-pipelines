  mongodb:
    image: mongodb/mongodb-community-server:8.0-ubi9-slim  
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - ./mongodb/data:/data/db
      - ./mongodb/logs:/var/log/mongodb
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/27017"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentic-net

  # node-red-mcp-service:
  #   profiles: ["http"]
  #   build: ./agent-runtime
  #   container_name: node-red-mcp-service
